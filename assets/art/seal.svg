<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="印：方印与缺角，印泥在洇">
  <defs>
    <linearGradient id="s-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0.066"/>
    </linearGradient>
  </defs>
  <style>
    .seal { animation: press 9s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 600px 214px; }
    .speck { animation: drift 14s ease-in-out infinite alternate; }
    .dot { animation: glow 6s ease-in-out infinite alternate; }
    @keyframes press { from { transform: scale(1); } to { transform: scale(1.012); } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(3px, -2px); } }
    @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="420" fill="url(#s-paper)"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#1B1B1D" stroke-width="1" opacity="0.132"/>
  <g class="seal">
    <rect x="524" y="138" width="152" height="152" rx="2" fill="#1B1B1D" opacity="0.86"/>
    <rect x="540" y="154" width="120" height="120" rx="1" fill="none" stroke="#FAF9F5" stroke-width="2.4" opacity="0.92"/>
    <path d="M540 238 C 570 238 576 244 576 274" fill="none" stroke="#1B1B1D" stroke-width="13"/>
    <path d="M630 154 C 630 180 640 190 660 190" fill="none" stroke="#1B1B1D" stroke-width="13"/>
    <path d="M586 180 L 614 180 M 600 166 L 600 254" stroke="#FAF9F5" stroke-width="6" stroke-linecap="square" opacity="0.96"/>
    <path d="M586 220 C 598 206 612 218 616 232" stroke="#FAF9F5" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.96"/>
    <g stroke="#1B1B1D" stroke-width="1" opacity="0.37">
      <path d="M560 170 L 548 214"/><path d="M574 166 L 562 210"/><path d="M640 236 L 628 280"/>
    </g>
  </g>
  <g class="speck" fill="#1B1B1D" opacity="0.264">
    <circle cx="470" cy="196" r="1.3"/><circle cx="700" cy="182" r="1"/><circle cx="716" cy="238" r="1.5"/>
    <circle cx="486" cy="284" r="1.1"/><circle cx="668" cy="306" r="1.3"/><circle cx="738" cy="300" r=".9"/>
    <circle cx="512" cy="130" r=".9"/><circle cx="690" cy="126" r="1.1"/>
  </g>
  <circle class="dot" cx="700" cy="330" r="7" fill="#B0502A"/>
  <g stroke="#1B1B1D" fill="none" stroke-linecap="round" opacity="0.158">
    <path d="M300 350 C 420 344 520 354 640 348 S 880 338 1000 346" stroke-width="1"/>
    <path d="M360 372 C 480 366 580 376 700 370 S 940 360 1060 368" stroke-width=".9"/>
  </g>
</svg>
