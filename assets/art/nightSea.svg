<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="夜航：月、星、帆与夜色海面，星在闪">
  <defs>
    <linearGradient id="n-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0.66"/>
    </linearGradient>
    <radialGradient id="n-moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FAF9F5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FAF9F5" stop-opacity="0"/>
    </radialGradient>
    <mask id="n-moon"><rect width="1200" height="420" fill="#fff"/><circle cx="628" cy="208" r="27" fill="#000"/><circle cx="619" cy="201" r="23" fill="#fff"/></mask>
  </defs>
  <style>
    .star { animation: twinkle 5s ease-in-out infinite; }
    .star:nth-child(2n) { animation-duration: 7s; animation-delay: -2s; }
    .star:nth-child(3n) { animation-duration: 9s; animation-delay: -4s; }
    .tide-a { animation: tide-a 18s ease-in-out infinite alternate; }
    .boat { animation: bob 8s ease-in-out infinite alternate; }
    .lantern { animation: lantern 4.5s ease-in-out infinite alternate; }
    @keyframes twinkle { 0%,100% { opacity: .28; } 50% { opacity: .95; } }
    @keyframes tide-a { from { transform: translateX(0); } to { transform: translateX(-14px); } }
    @keyframes bob { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-2.6px) rotate(-.4deg); } }
    @keyframes lantern { from { opacity: .55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g fill="#FAF9F5">
    <circle class="star" cx="220" cy="128" r="1.6"/><circle class="star" cx="306" cy="88" r="1.1"/>
    <circle class="star" cx="372" cy="162" r="1.3"/><circle class="star" cx="446" cy="104" r="1"/>
    <circle class="star" cx="520" cy="150" r="1.5"/><circle class="star" cx="590" cy="92" r=".9"/>
    <circle class="star" cx="700" cy="146" r="1.2"/><circle class="star" cx="760" cy="86" r="1.6"/>
    <circle class="star" cx="846" cy="126" r="1"/><circle class="star" cx="916" cy="166" r="1.3"/>
    <circle class="star" cx="1006" cy="106" r="1.1"/><circle class="star" cx="1080" cy="154" r="1.5"/>
    <circle class="star" cx="1140" cy="96" r=".9"/><circle class="star" cx="266" cy="196" r=".9"/>
  </g>
  <circle cx="628" cy="208" r="86" fill="url(#n-moonGlow)" opacity="0.5"/>
  <circle cx="628" cy="208" r="27" fill="#1B1B1D" opacity="0.84" mask="url(#n-moon)"/>
  <rect y="300" width="1200" height="120" fill="url(#n-sea)"/>
  <g class="tide-a" fill="none" stroke="#FAF9F5" stroke-linecap="round">
    <path d="M-30 322 C 140 314 260 330 420 322 S 720 310 880 320 S 1120 328 1230 318" stroke-width="1.2" opacity="0.224"/>
    <path d="M-30 344 C 160 336 300 352 470 344 S 760 332 930 344 S 1140 350 1230 340" stroke-width="1" opacity="0.132"/>
    <path d="M-30 368 C 180 360 340 374 520 366 S 800 354 980 366 S 1160 370 1230 362" stroke-width=".9" opacity="0.092"/>
  </g>
  <g fill="#FAF9F5" opacity="0.55">
    <circle cx="300" cy="332" r="1"/><circle cx="392" cy="350" r=".9"/><circle cx="520" cy="336" r="1"/>
    <circle cx="660" cy="352" r=".9"/><circle cx="760" cy="338" r="1"/><circle cx="900" cy="350" r=".8"/>
    <circle cx="1040" cy="336" r="1"/><circle cx="428" cy="366" r=".9"/>
  </g>
  <g fill="#1B1B1D" opacity="0.5">
    <path d="M120 300 C 140 292 158 290 174 294 C 186 297 196 299 206 300 Z"/>
    <path d="M1016 300 C 1032 293 1048 292 1062 295 C 1072 297 1080 299 1088 300 Z"/>
  </g>
  <g class="boat">
    <path d="M812 300 L812 226" stroke="#FAF9F5" stroke-width="1.4" opacity="0.55"/>
    <path d="M813 230 C 843 241 860 261 868 289 L813 289 Z" fill="#FAF9F5" opacity="0.84"/>
    <g stroke="#1B1B1D" stroke-width=".7" opacity="0.238">
      <path d="M822 240 L858 284"/><path d="M820 252 L844 284"/>
    </g>
    <path d="M806 298 C 796 300 788 302 780 305 C 796 309 820 310 848 306 C 836 302 824 299 812 298 Z" fill="#FAF9F5" opacity="0.5"/>
    <circle class="lantern" cx="846" cy="292" r="4.4" fill="#B0502A"/>
    <ellipse cx="846" cy="318" rx="26" ry="2" fill="#B0502A" opacity="0.238"/>
  </g>
</svg>
