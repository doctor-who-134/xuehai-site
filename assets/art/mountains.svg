<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="书山：两重山脊、雾与飞鸟">
  <defs>
    <linearGradient id="m-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0"/>
      <stop offset=".7" stop-color="#1B1B1D" stop-opacity="0.046"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0.079"/>
    </linearGradient>
  </defs>
  <style>
    .mist { animation: mist 26s ease-in-out infinite alternate; }
    .bird { animation: glide 10s ease-in-out infinite alternate; }
    .tide-a { animation: tide-a 19s ease-in-out infinite alternate; }
    @keyframes mist { from { transform: translateX(0); } to { transform: translateX(-22px); } }
    @keyframes glide { from { transform: translate(0, 0); } to { transform: translate(16px, -6px); } }
    @keyframes tide-a { from { transform: translateX(0); } to { transform: translateX(10px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
