<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="芦苇：五茎芦苇与风，苇在摇">
  <defs>
    <linearGradient id="r-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0.073"/>
    </linearGradient>
  </defs>
  <style>
    .reed { transform-box: view-box; animation: sway 7s ease-in-out infinite alternate; }
    .reed:nth-of-type(2) { animation-duration: 8.2s; animation-delay: -1.5s; }
    .reed:nth-of-type(3) { animation-duration: 9.4s; animation-delay: -3s; }
    .reed:nth-of-type(4) { animation-duration: 7.6s; animation-delay: -2.2s; }
    .reed:nth-of-type(5) { animation-duration: 10.2s; animation-delay: -4s; }
    .wind { animation: wind 18s linear infinite; }
    .tide-a { animation: tide-a 20s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.4deg); } }
    @keyframes wind { 0% { transform: translateX(0); opacity: .1; } 50% { opacity: .3; } 100% { transform: translateX(70px); opacity: .05; } }
    @keyframes tide-a { from { transform: translateX(0); } to { transform: translateX(9px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="300" fill="url(#r-mist)"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#1B1B1D" stroke-width="1" opacity="0.198"/>
  <g class="tide-a" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M-30 320 C 160 312 300 328 480 320 S 780 308 960 320 S 1160 324 1230 316" stroke-width="1.1" opacity="0.198"/>
    <path d="M-30 346 C 180 338 340 354 520 346 S 820 334 1000 346 S 1160 350 1230 342" stroke-width="1" opacity="0.119"/>
  </g>
  <g class="wind" fill="none" stroke="#1B1B1D" stroke-width="1" opacity="0.238" stroke-linecap="round">
    <path d="M520 176 C 600 170 660 184 740 176"/>
    <path d="M580 208 C 660 202 720 214 800 206"/>
    <path d="M500 242 C 570 237 630 247 700 241"/>
  </g>
  <g class="reed" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M200 420 C 206 384 196 348 210 312" stroke-width="1.8" opacity="0.72"/>
    <path d="M272 420 C 276 388 268 356 278 326" stroke-width="1.5" opacity="0.62"/>
    <path d="M344 420 C 348 392 340 362 350 336" stroke-width="1.6" opacity="0.68"/>
    <path d="M412 420 C 416 396 410 372 418 352" stroke-width="1.3" opacity="0.5"/>
    <path d="M478 420 C 482 400 476 380 484 362" stroke-width="1.1" opacity="0.42"/>
  </g>
  <g fill="#1B1B1D">
    <ellipse cx="210" cy="308" rx="4.8" ry="14" opacity="0.82" transform="rotate(-8 210 308)"/>
    <ellipse cx="278" cy="322" rx="4.2" ry="12" opacity="0.7" transform="rotate(-5 278 322)"/>
    <ellipse cx="350" cy="332" rx="4.6" ry="13" opacity="0.76" transform="rotate(-9 350 332)"/>
    <ellipse cx="418" cy="348" rx="3.8" ry="10" opacity="0.56" transform="rotate(-4 418 348)"/>
    <ellipse cx="484" cy="358" rx="3.4" ry="9" opacity="0.46" transform="rotate(-7 484 358)"/>
  </g>
  <circle cx="760" cy="252" r="11" fill="#B0502A" opacity="0.9"/>
  <circle cx="760" cy="252" r="34" fill="#B0502A" opacity="0.092"/>
  <path d="M760 266 C 756 282 766 292 762 302" stroke="#1B1B1D" stroke-width="1.2" opacity="0.42" fill="none"/>
  <g class="reed" fill="none" stroke="#1B1B1D" stroke-linecap="round" opacity="0.343">
    <path d="M560 420 C 564 398 558 378 566 358" stroke-width="1"/>
    <path d="M620 420 C 624 402 618 384 626 366" stroke-width=".9"/>
    <path d="M680 420 C 684 404 678 388 686 372" stroke-width=".8"/>
