<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="三道潮：三道潮线与小舟，潮在走">
  <defs>
    <linearGradient id="w-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0502A" stop-opacity="0.396"/>
      <stop offset="1" stop-color="#B0502A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: w1 13s ease-in-out infinite alternate; }
    .w2 { animation: w2 17s ease-in-out infinite alternate; }
    .w3 { animation: w3 21s ease-in-out infinite alternate; }
    .boat { animation: bob 6.5s ease-in-out infinite alternate; }
    .sun { animation: sunpulse 10s ease-in-out infinite alternate; }
    @keyframes w1 { from { transform: translate(0, 0); } to { transform: translate(-16px, 1px); } }
    @keyframes w2 { from { transform: translate(0, 0); } to { transform: translate(12px, -1px); } }
    @keyframes w3 { from { transform: translate(0, 0); } to { transform: translate(-8px, 2px); } }
    @keyframes bob { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-3px) rotate(1deg); } }
    @keyframes sunpulse { from { opacity: .9; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#1B1B1D" stroke-width="1" opacity="0.158"/>
  <g class="w1" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M-30 256 C 120 238 250 274 400 256 S 660 218 820 248 S 1090 284 1230 260" stroke-width="2.1" opacity="0.343"/>
  </g>
  <g class="w2" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M-30 304 C 140 286 280 322 440 304 S 720 266 890 298 S 1130 330 1230 308" stroke-width="1.6" opacity="0.238"/>
  </g>
  <g class="w3" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M-30 350 C 160 334 320 366 500 348 S 780 316 950 342 S 1150 364 1230 350" stroke-width="1.1" opacity="0.145"/>
    <path d="M-30 386 C 200 374 400 392 580 382 S 880 368 1060 382 S 1180 386 1230 382" stroke-width=".9" opacity="0.092"/>
  </g>
  <g class="boat">
    <path d="M650 248 L650 196" stroke="#1B1B1D" stroke-width="1.3" opacity="0.78"/>
    <path d="M651 200 C 673 208 685 220 691 238 L651 238 Z" fill="#1B1B1D" opacity="0.76"/>
    <path d="M644 246 C 634 248 626 250 618 253 C 634 257 656 258 680 254 C 670 250 660 247 650 246 Z" fill="#1B1B1D" opacity="0.64"/>
    <ellipse cx="650" cy="259" rx="30" ry="2" fill="#1B1B1D" opacity="0.132"/>
  </g>
  <circle class="sun" cx="272" cy="198" r="18" fill="#B0502A"/>
  <circle cx="272" cy="198" r="52" fill="url(#w-glow)" opacity="0.4"/>
  <ellipse cx="272" cy="262" rx="44" ry="3" fill="#B0502A" opacity="0.158"/>
  <g stroke="#1B1B1D" stroke-width="1.2" fill="none" opacity="0.36" stroke-linecap="round">
    <path d="M760 148 C 768 141 774 141 780 147 C 786 141 792 141 800 148"/>
    <path d="M846 120 C 852 115 857 115 862 120"/>
  </g>
</svg>
