<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="晨潮：初日、帆与三层潮线，雾在流动">
  <defs>
    <linearGradient id="d-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0"/>
      <stop offset=".55" stop-color="#1B1B1D" stop-opacity="0.04"/>
      <stop offset=".9" stop-color="#1B1B1D" stop-opacity="0.092"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0.106"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="d-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B0502A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#B0502A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B1D" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#1B1B1D" stop-opacity="0.62"/>
    </linearGradient>
  </defs>
  <style>
    .mist-a { animation: mist-a 30s ease-in-out infinite alternate; }
    .mist-b { animation: mist-b 24s ease-in-out infinite alternate; }
    .tide-a { animation: tide-a 16s ease-in-out infinite alternate; }
    .tide-b { animation: tide-b 21s ease-in-out infinite alternate; }
    .boat { animation: bob 7s ease-in-out infinite alternate; }
    .bird { animation: glide 11s ease-in-out infinite alternate; }
    .sun { animation: sunpulse 12s ease-in-out infinite alternate; }
    @keyframes mist-a { from { transform: translateX(0); } to { transform: translateX(26px); } }
    @keyframes mist-b { from { transform: translateX(0); } to { transform: translateX(-18px); } }
    @keyframes tide-a { from { transform: translateX(0); } to { transform: translateX(-12px); } }
    @keyframes tide-b { from { transform: translateX(0); } to { transform: translateX(9px); } }
    @keyframes bob { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-2.4px) rotate(.5deg); } }
    @keyframes glide { from { transform: translate(0, 0); } to { transform: translate(20px, -5px); } }
    @keyframes sunpulse { from { opacity: .92; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="300" fill="url(#d-mist)"/>
  <g class="mist-a" opacity="0.5">
    <path d="M-40 232 C 150 224 300 238 470 230 S 760 218 930 228 S 1150 234 1240 226" stroke="#1B1B1D" stroke-width="7" fill="none" opacity="0.059"/>
    <path d="M-60 260 C 140 253 320 266 500 258 S 820 246 1000 256 S 1180 260 1260 254" stroke="#1B1B1D" stroke-width="4" fill="none" opacity="0.053"/>
  </g>
  <g class="mist-b">
    <path d="M60 188 C 260 182 420 192 600 186 S 900 176 1080 184" stroke="#1B1B1D" stroke-width="9" fill="none" opacity="0.046"/>
  </g>
  <g fill="#1B1B1D" opacity="0.079">
    <path d="M0 278 C 120 252 232 236 332 250 C 432 262 502 276 622 279 C 762 283 902 268 1022 274 L1200 268 L1200 300 L0 300 Z"/>
    <path d="M330 250 L352 232 L372 252 Z" opacity="0.7"/>
    <path d="M640 279 L668 258 L694 282 Z" opacity="0.55"/>
  </g>
  <path d="M96 300 C 118 288 136 285 154 290 C 168 294 178 296 190 300 Z" fill="#1B1B1D" opacity="0.185"/>
  <path d="M958 300 C 976 291 990 289 1004 293 C 1014 296 1022 298 1032 300 Z" fill="#1B1B1D" opacity="0.132"/>
  <rect y="300" width="1200" height="120" fill="url(#d-sea)"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#1B1B1D" stroke-width="1" opacity="0.198"/>
  <g class="tide-a" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M-40 318 C 140 310 260 326 420 318 S 720 306 880 316 S 1120 324 1240 314" stroke-width="1.2" opacity="0.343"/>
    <path d="M-40 340 C 160 332 300 348 470 340 S 760 328 930 340 S 1140 346 1240 336" stroke-width="1.1" opacity="0.224"/>
  </g>
  <g class="tide-b" fill="none" stroke="#1B1B1D" stroke-linecap="round">
    <path d="M-40 366 C 180 358 340 372 520 364 S 800 352 980 364 S 1160 368 1240 360" stroke-width="1" opacity="0.158"/>
    <path d="M-40 388 C 200 382 380 392 560 386 S 840 378 1020 386 S 1160 388 1240 384" stroke-width=".9" opacity="0.106"/>
  </g>
  <g fill="none" stroke="#1B1B1D" stroke-linecap="round" opacity="0.238">
    <path d="M160 327 C 172 324 184 324 196 327" stroke-width=".8"/>
    <path d="M540 335 C 552 332 564 332 576 335" stroke-width=".8"/>
    <path d="M880 325 C 892 322 904 322 916 325" stroke-width=".8"/>
  </g>
  <g class="boat">
    <path d="M900 300 L900 228" stroke="#1B1B1D" stroke-width="1.5" opacity="0.78"/>
    <path d="M901 231 C 930 241 948 260 956 288 L901 288 Z" fill="url(#d-sail)"/>
    <g stroke="#FAF9F5" stroke-width=".7" opacity="0.264">
      <path d="M910 240 L946 284"/><path d="M908 250 L934 284"/><path d="M906 262 L920 283"/>
    </g>
    <path d="M893 298 C 883 300 875 302 866 305 C 883 309 908 311 940 306 C 926 302 912 299 900 298 Z" fill="#1B1B1D" opacity="0.72"/>
    <ellipse cx="903" cy="311" rx="40" ry="2.4" fill="#1B1B1D" opacity="0.132"/>
  </g>
  <circle class="sun" cx="742" cy="238" r="19" fill="#B0502A"/>
  <circle cx="742" cy="238" r="64" fill="url(#d-glow)" opacity="0.55"/>
  <ellipse cx="742" cy="306" rx="56" ry="4" fill="#B0502A" opacity="0.211"/>
  <g class="bird" stroke="#1B1B1D" stroke-width="1.2" fill="none" opacity="0.42" stroke-linecap="round">
    <path d="M960 140 C 968 132 974 132 980 138 C 986 132 992 132 1000 140"/>
    <path d="M1024 116 C 1030 110 1035 110 1040 115 C 1045 110 1050 110 1056 116"/>
    <path d="M892 164 C 898 158 903 158 908 163 C 913 158 918 158 924 164"/>
  </g>
  <g class="reeds" stroke="#1B1B1D" fill="none" stroke-linecap="round" opacity="0.34">
    <path d="M78 420 C 84 392 78 366 86 342" stroke-width="1.5"/>
    <path d="M124 420 C 128 396 122 372 130 350" stroke-width="1.2"/>
    <path d="M168 420 C 172 400 166 382 174 362" stroke-width="1"/>
    <ellipse cx="86" cy="340" rx="3" ry="8.5" fill="#1B1B1D" stroke="none" opacity="0.5"/>
    <ellipse cx="130" cy="348" rx="2.6" ry="7" fill="#1B1B1D" stroke="none" opacity="0.45"/>
    <ellipse cx="174" cy="360" rx="2.2" ry="6" fill="#1B1B1D" stroke="none" opacity="0.38"/>
  </g>
</svg>
